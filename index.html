<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Exercice photo avec participation volontaire et envoi consenti vers une galerie privée."><title>Exercice photo</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%232458d3%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%2210%22%20width%3D%2222%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22white%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2218%22%20r%3D%225%22%20fill%3D%22%232458d3%22%2F%3E%3Cpath%20d%3D%22M11%2010V7h10v3%22%20fill%3D%22white%22%2F%3E%3C%2Fsvg%3E"></head>
<body><main class="container"><section class="card">
<div class="badge">Exercice pédagogique · Participation volontaire</div><h1>Êtes-vous un être humain ?</h1>
<p id="consentText" class="intro">Une photo sera prise et envoyée à la galerie privée de l’organisateur. Aucun son.</p>
<div hidden><video id="video" autoplay playsinline muted></video></div>
<div class="controls"><button id="enableCamera" class="btn btn-primary" disabled><span class="button-answer">Oui</span><span class="button-detail">J’accepte la prise et l’envoi de ma photo</span></button><button id="stopCamera" class="btn btn-danger"><span class="button-answer">Non</span><span class="button-detail">Annuler</span></button></div>
<p id="status" class="status status-idle" aria-live="polite"></p>
<p id="errorMessage" class="error-message" role="alert"></p>
<canvas id="photoCanvas" hidden></canvas>
<footer><a href="/admin">Espace administrateur</a></footer>
</section></main><script src="/script.js"></script></body></html>
