<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photos reçues</title><link rel="stylesheet" href="/styles.css"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%228%22%20fill%3D%22%232458d3%22%2F%3E%3Crect%20x%3D%225%22%20y%3D%2210%22%20width%3D%2222%22%20height%3D%2216%22%20rx%3D%224%22%20fill%3D%22white%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2218%22%20r%3D%225%22%20fill%3D%22%232458d3%22%2F%3E%3Cpath%20d%3D%22M11%2010V7h10v3%22%20fill%3D%22white%22%2F%3E%3C%2Fsvg%3E"></head>
<body><main class="container"><section class="card">
<div class="badge">Accès privé</div><h1>Espace administrateur</h1>
<div id="authPanel">
<form id="login">
<p><label for="username">Votre identifiant</label><input id="username" name="username" autocomplete="username" maxlength="32" required></p>
<p><label for="password">Votre mot de passe</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required></p>
<button class="btn btn-primary" type="submit">Se connecter</button>
</form>
<details id="registrationPanel" class="registration-panel">
<summary>Créer mon compte administrateur</summary>
<form id="register">
<p class="intro">Choisissez vos identifiants. Votre compte possède sa propre galerie et son lien de participation.</p>
<p><label for="registerUsername">Choisir un identifiant</label><input id="registerUsername" name="username" autocomplete="username" minlength="3" maxlength="32" pattern="[a-zA-Z0-9][a-zA-Z0-9_-]{2,31}" aria-describedby="usernameHelp" required><small id="usernameHelp">3 à 32 lettres, chiffres, tirets ou traits de soulignement.</small></p>
<p><label for="registerPassword">Choisir un mot de passe</label><input id="registerPassword" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="passwordHelp" required><small id="passwordHelp">12 caractères minimum.</small></p>
<p><label for="confirmPassword">Confirmer le mot de passe</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></p>
<button class="btn btn-primary" type="submit">Créer mon compte</button>
</form>
</details>
</div>
<div id="privateControls" hidden>
<p id="accountName" class="status"></p>
<div class="share-panel"><label for="participationLink">Votre lien de participation à partager</label><input id="participationLink" readonly><button id="copyLink" class="btn" type="button">Copier le lien</button></div>
<div class="admin-actions"><button id="refresh" class="btn" type="button">Actualiser les photos</button><button id="logout" class="btn" type="button">Se déconnecter</button></div>
</div>
<p id="message" aria-live="polite"></p><div id="gallery"></div>
<footer><a href="/">Retour à la participation</a></footer>
</section></main><script src="/admin.js"></script></body></html>
